syntax = "proto3";

package packages.api.v1.errors;

option go_package = "p9e.in/ugcl/packages/api/v1/errors;errors";
option objc_class_prefix = "P9Errors";

import "google/protobuf/descriptor.proto";

message Status {
  int32 code = 1;
  string reason = 2;
  string message = 3;
  map<string, string> metadata = 4;
};

extend google.protobuf.EnumOptions {
  int32 default_code = 1106;
}

extend google.protobuf.EnumValueOptions {
  int32 code = 1107;
}