syntax = "proto3";

package approvalworkflow.api.v1;
option go_package = "p9e.in/ugcl/approvalworkflow/api/proto;approvalworkflowpb";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

// =============================================================================
// APPROVAL WORKFLOW SERVICE
// =============================================================================

service ApprovalWorkflowService {
  // Workflow Management
  rpc CreateWorkflow(CreateWorkflowRequest) returns (CreateWorkflowResponse);
  rpc GetWorkflow(GetWorkflowRequest) returns (GetWorkflowResponse);
  rpc UpdateWorkflow(UpdateWorkflowRequest) returns (UpdateWorkflowResponse);
  rpc DeleteWorkflow(DeleteWorkflowRequest) returns (google.protobuf.Empty);
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);

  // Approval Process Management
  rpc StartApprovalProcess(StartApprovalProcessRequest) returns (StartApprovalProcessResponse);
  rpc ProcessApprovalAction(ProcessApprovalActionRequest) returns (ProcessApprovalActionResponse);
  rpc GetApprovalInstance(GetApprovalInstanceRequest) returns (GetApprovalInstanceResponse);
  rpc ListApprovalInstances(ListApprovalInstancesRequest) returns (ListApprovalInstancesResponse);
  rpc CancelApprovalInstance(CancelApprovalInstanceRequest) returns (google.protobuf.Empty);

  // Delegation Management
  rpc CreateDelegate(CreateDelegateRequest) returns (CreateDelegateResponse);
  rpc UpdateDelegate(UpdateDelegateRequest) returns (UpdateDelegateResponse);
  rpc DeleteDelegate(DeleteDelegateRequest) returns (google.protobuf.Empty);
  rpc ListDelegates(ListDelegatesRequest) returns (ListDelegatesResponse);

  // Reporting and Analytics
  rpc GetApprovalMetrics(GetApprovalMetricsRequest) returns (GetApprovalMetricsResponse);
  rpc GetPendingApprovals(GetPendingApprovalsRequest) returns (GetPendingApprovalsResponse);
  rpc GetApprovalHistory(GetApprovalHistoryRequest) returns (GetApprovalHistoryResponse);

  // Escalation Management
  rpc ProcessEscalations(google.protobuf.Empty) returns (ProcessEscalationsResponse);
  rpc GetEscalatedApprovals(GetEscalatedApprovalsRequest) returns (GetEscalatedApprovalsResponse);
}

// =============================================================================
// ENUMS
// =============================================================================

enum ApprovalStatus {
  APPROVAL_STATUS_UNSPECIFIED = 0;
  APPROVAL_STATUS_PENDING = 1;
  APPROVAL_STATUS_IN_PROGRESS = 2;
  APPROVAL_STATUS_APPROVED = 3;
  APPROVAL_STATUS_REJECTED = 4;
  APPROVAL_STATUS_CANCELLED = 5;
  APPROVAL_STATUS_ESCALATED = 6;
  APPROVAL_STATUS_EXPIRED = 7;
}

enum ActionType {
  ACTION_TYPE_UNSPECIFIED = 0;
  ACTION_TYPE_APPROVE = 1;
  ACTION_TYPE_REJECT = 2;
  ACTION_TYPE_DELEGATE = 3;
  ACTION_TYPE_REQUEST_INFO = 4;
  ACTION_TYPE_WITHDRAW = 5;
  ACTION_TYPE_REASSIGN = 6;
}

enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_LOW = 1;
  PRIORITY_MEDIUM = 2;
  PRIORITY_HIGH = 3;
  PRIORITY_CRITICAL = 4;
}

enum StepType {
  STEP_TYPE_UNSPECIFIED = 0;
  STEP_TYPE_SEQUENTIAL = 1;
  STEP_TYPE_PARALLEL = 2;
  STEP_TYPE_CONDITIONAL = 3;
  STEP_TYPE_ESCALATION = 4;
  STEP_TYPE_AUTOMATIC = 5;
}

enum ApproverType {
  APPROVER_TYPE_UNSPECIFIED = 0;
  APPROVER_TYPE_USER = 1;
  APPROVER_TYPE_ROLE = 2;
  APPROVER_TYPE_DEPARTMENT = 3;
  APPROVER_TYPE_MANAGER = 4;
  APPROVER_TYPE_SKIP_MANAGER = 5;
  APPROVER_TYPE_CUSTOM_QUERY = 6;
}

enum VotingType {
  VOTING_TYPE_UNSPECIFIED = 0;
  VOTING_TYPE_SIMPLE = 1;
  VOTING_TYPE_WEIGHTED = 2;
  VOTING_TYPE_CONSENSUS = 3;
  VOTING_TYPE_THRESHOLD = 4;
}

// =============================================================================
// MESSAGES
// =============================================================================

message ApprovalWorkflow {
  string id = 1;
  string name = 2;
  string description = 3;
  string entity_type = 4;
  int32 version = 5;
  bool is_active = 6;
  bool is_default = 7;
  repeated ApprovalStep steps = 8;
  repeated ApprovalRule rules = 9;
  repeated EscalationRule escalations = 10;
  repeated NotificationRule notifications = 11;
  repeated ConditionalRule conditional_logic = 12;
  string created_by = 13;
  string updated_by = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  google.protobuf.Struct metadata = 17;
}

message ApprovalStep {
  string id = 1;
  string name = 2;
  string description = 3;
  StepType step_type = 4;
  int32 order = 5;
  bool is_required = 6;
  repeated Approver approvers = 7;
  ApprovalCriteria approval_criteria = 8;
  int64 timeout_duration_seconds = 9;
  repeated EscalationRule escalation_rules = 10;
  repeated Condition conditions = 11;
  google.protobuf.Struct properties = 12;
}

message Approver {
  string id = 1;
  ApproverType type = 2;
  string value = 3;
  string display_name = 4;
  bool is_alternate = 5;
  int32 priority = 6;
  bool can_delegate = 7;
  double max_amount = 8;
}

message ApprovalCriteria {
  int32 required_approvals = 1;
  bool require_all = 2;
  bool reject_on_first = 3;
  VotingType voting_type = 4;
  repeated WeightedApprover weighted_voting = 5;
}

message WeightedApprover {
  string approver_id = 1;
  double weight = 2;
}

message ApprovalRule {
  string id = 1;
  string name = 2;
  string condition = 3;
  string action = 4;
  google.protobuf.Struct parameters = 5;
}

message EscalationRule {
  string id = 1;
  int64 trigger_after_seconds = 2;
  int32 escalation_level = 3;
  ApproverType escalate_to_type = 4;
  string escalate_to_value = 5;
  string action = 6;
  bool notify_original = 7;
  int32 max_escalations = 8;
}

message NotificationRule {
  string id = 1;
  string event = 2;
  repeated string channels = 3;
  repeated string recipients = 4;
  string template = 5;
}

message ConditionalRule {
  string id = 1;
  repeated Condition conditions = 2;
  string action = 3;
  google.protobuf.Struct parameters = 4;
}

message Condition {
  string field = 1;
  string operator = 2;
  google.protobuf.Value value = 3;
  string logic_op = 4;
}

message ApprovalInstance {
  string id = 1;
  string workflow_id = 2;
  string entity_type = 3;
  string entity_id = 4;
  string requested_by = 5;
  string current_step = 6;
  ApprovalStatus status = 7;
  Priority priority = 8;
  google.protobuf.Struct request_data = 9;
  string comments = 10;
  repeated string attachment_urls = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  google.protobuf.Timestamp completed_at = 14;
  google.protobuf.Timestamp escalated_at = 15;
  int32 escalation_level = 16;
  google.protobuf.Timestamp sla_start_time = 17;
  google.protobuf.Timestamp sla_end_time = 18;
  bool sla_breached = 19;
  google.protobuf.Struct metadata = 20;
}

message ApprovalAction {
  string id = 1;
  string instance_id = 2;
  string step_id = 3;
  string approver_id = 4;
  ActionType action = 5;
  string comments = 6;
  google.protobuf.Timestamp acted_at = 7;
  string ip_address = 8;
  string user_agent = 9;
  string delegated_from = 10;
  repeated string attachment_urls = 11;
  google.protobuf.Struct metadata = 12;
}

message ApprovalDelegate {
  string id = 1;
  string delegator_id = 2;
  string delegate_id = 3;
  repeated string entity_types = 4;
  google.protobuf.Timestamp start_date = 5;
  google.protobuf.Timestamp end_date = 6;
  bool is_active = 7;
  string reason = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Struct metadata = 10;
}

// =============================================================================
// REQUEST/RESPONSE MESSAGES
// =============================================================================

// Workflow Management
message CreateWorkflowRequest {
  ApprovalWorkflow workflow = 1;
}

message CreateWorkflowResponse {
  ApprovalWorkflow workflow = 1;
}

message GetWorkflowRequest {
  string id = 1;
}

message GetWorkflowResponse {
  ApprovalWorkflow workflow = 1;
}

message UpdateWorkflowRequest {
  ApprovalWorkflow workflow = 1;
}

message UpdateWorkflowResponse {
  ApprovalWorkflow workflow = 1;
}

message DeleteWorkflowRequest {
  string id = 1;
}

message ListWorkflowsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string entity_type = 3;
  bool active_only = 4;
}

message ListWorkflowsResponse {
  repeated ApprovalWorkflow workflows = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Approval Process Management
message StartApprovalProcessRequest {
  string entity_type = 1;
  string entity_id = 2;
  string requested_by = 3;
  Priority priority = 4;
  google.protobuf.Struct request_data = 5;
  string comments = 6;
  repeated string attachment_urls = 7;
  google.protobuf.Struct metadata = 8;
}

message StartApprovalProcessResponse {
  ApprovalInstance instance = 1;
}

message ProcessApprovalActionRequest {
  string instance_id = 1;
  string approver_id = 2;
  ActionType action = 3;
  string comments = 4;
  string ip_address = 5;
  string user_agent = 6;
  string delegated_from = 7;
  string delegate_to = 8;
  repeated string attachment_urls = 9;
  google.protobuf.Struct metadata = 10;
}

message ProcessApprovalActionResponse {
  ApprovalAction action = 1;
  ApprovalInstance updated_instance = 2;
}

message GetApprovalInstanceRequest {
  string id = 1;
}

message GetApprovalInstanceResponse {
  ApprovalInstance instance = 1;
  repeated ApprovalAction actions = 2;
}

message ListApprovalInstancesRequest {
  int32 page_size = 1;
  string page_token = 2;
  repeated ApprovalStatus status_filter = 3;
  string entity_type = 4;
  string requested_by = 5;
  google.protobuf.Timestamp created_after = 6;
  google.protobuf.Timestamp created_before = 7;
}

message ListApprovalInstancesResponse {
  repeated ApprovalInstance instances = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message CancelApprovalInstanceRequest {
  string id = 1;
  string cancelled_by = 2;
  string reason = 3;
}

// Delegation Management
message CreateDelegateRequest {
  ApprovalDelegate delegate = 1;
}

message CreateDelegateResponse {
  ApprovalDelegate delegate = 1;
}

message UpdateDelegateRequest {
  ApprovalDelegate delegate = 1;
}

message UpdateDelegateResponse {
  ApprovalDelegate delegate = 1;
}

message DeleteDelegateRequest {
  string id = 1;
}

message ListDelegatesRequest {
  int32 page_size = 1;
  string page_token = 2;
  string delegator_id = 3;
  string delegate_id = 4;
  bool active_only = 5;
}

message ListDelegatesResponse {
  repeated ApprovalDelegate delegates = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Reporting and Analytics
message GetApprovalMetricsRequest {
  google.protobuf.Timestamp start_date = 1;
  google.protobuf.Timestamp end_date = 2;
  string entity_type = 3;
  string workflow_id = 4;
}

message GetApprovalMetricsResponse {
  int64 total_requests = 1;
  int64 approved_count = 2;
  int64 rejected_count = 3;
  int64 pending_count = 4;
  int64 escalated_count = 5;
  double avg_processing_time_hours = 6;
  double sla_compliance_rate = 7;
  repeated MetricData daily_metrics = 8;
  repeated BottleneckInfo bottlenecks = 9;
}

message MetricData {
  google.protobuf.Timestamp date = 1;
  int64 count = 2;
  double avg_time_hours = 3;
}

message BottleneckInfo {
  string step_id = 1;
  string step_name = 2;
  double avg_time_hours = 3;
  int64 pending_count = 4;
}

message GetPendingApprovalsRequest {
  string user_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  Priority priority_filter = 4;
}

message GetPendingApprovalsResponse {
  repeated PendingApproval approvals = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message PendingApproval {
  string instance_id = 1;
  string workflow_name = 2;
  string entity_type = 3;
  string entity_id = 4;
  Priority priority = 5;
  string requested_by = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp sla_end_time = 8;
  string current_step = 9;
  bool is_overdue = 10;
}

message GetApprovalHistoryRequest {
  string instance_id = 1;
}

message GetApprovalHistoryResponse {
  repeated ApprovalAction actions = 1;
  repeated EscalationEvent escalations = 2;
  repeated NotificationEvent notifications = 3;
}

message EscalationEvent {
  string id = 1;
  string instance_id = 2;
  int32 escalation_level = 3;
  string escalated_to = 4;
  google.protobuf.Timestamp escalated_at = 5;
  string reason = 6;
}

message NotificationEvent {
  string id = 1;
  string instance_id = 2;
  string type = 3;
  string recipient = 4;
  string channel = 5;
  google.protobuf.Timestamp sent_at = 6;
  bool delivered = 7;
}

// Escalation Management
message ProcessEscalationsResponse {
  int32 processed_count = 1;
  repeated string escalated_instances = 2;
}

message GetEscalatedApprovalsRequest {
  int32 page_size = 1;
  string page_token = 2;
  int32 escalation_level = 3;
}

message GetEscalatedApprovalsResponse {
  repeated ApprovalInstance instances = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}