syntax = "proto3";

package identity.tenant.api.v1.tenant;
option go_package = "p9e.in/ugcl/identity/tenant/api/v1/tenant;tenant";

import "google/protobuf/wrappers.proto";
import "google/protobuf/field_mask.proto";
import "packages/proto/fields.proto";
import "packages/proto/query.proto";	

service TenantService {

	//CreateTenant
	rpc CreateTenant (CreateTenantRequest) returns (Tenant){}
	//UpdateTenant
	rpc UpdateTenant (UpdateTenantRequest) returns (Tenant){}
	//DeleteTenant
	rpc DeleteTenant (DeleteTenantRequest) returns (DeleteTenantReply){}
	// GetTenant
	rpc GetTenant (GetTenantRequest) returns (Tenant){}
	// GetTenant
	rpc GetTenantPublic (GetTenantPublicRequest) returns (TenantInfo){}
	//ListTenant
	rpc ListTenant (ListTenantRequest) returns (ListTenantReply){}
	//GetCurrentTenant
	rpc GetCurrentTenant (GetCurrentTenantRequest) returns (GetCurrentTenantReply){}

}


service TenantInternalService{
	//GetTenant internal api for remote tenant store
	rpc GetTenant (GetTenantRequest) returns (Tenant){
	}
}

message CreateTenantRequest {
	string name=2;
	string display_name=3;
	string region = 4;
	string logo =5;

	bool separate_db=6;

	optional google.protobuf.StringValue admin_email = 7;
	optional google.protobuf.StringValue admin_username=8;
	optional google.protobuf.StringValue admin_password=9;
	optional google.protobuf.StringValue admin_user_id=10;
}

message UpdateTenantRequest {
	UpdateTenant tenant=1;
	google.protobuf.FieldMask update_mask = 2;
}


message UpdateTenant{
	string id=1 ;
	string name =2 ;
	string display_name=3;

	repeated TenantConnectionString conn=7;
	repeated TenantFeature features=8;
	string logo =9;
}

message DeleteTenantRequest {
	string id=1;
}
message DeleteTenantReply {
	string id=1;
}

message GetTenantRequest {
	string id_or_name=1;
}

message GetTenantPublicRequest{
	string id_or_name=1;
}

message TenantFilter{
	packages.api.v1.query.StringFilterOperation id=1;
	packages.api.v1.query.StringFilterOperation name =2;
	packages.api.v1.query.StringFilterOperation region=4;
}

message ListTenantRequest {
	int32 page_offset =1;
	int32 page_size = 2;
	string search = 3;
	repeated string sort =4;
	google.protobuf.FieldMask fields=5;
	TenantFilter filter =6;
}

message ListTenantReply {
	int32 total_size =1;
	int32 filter_size =2;

	repeated Tenant items = 3;
}

message Tenant{
	string id=1;
	string name=2;
	string display_name=3;
	string region=4;
	repeated TenantConnectionString conn=5;
	repeated TenantFeature features=6;
	string logo = 7;
	TenantDB tenant_db = 8;
	packages.api.v1.fields.Fields data = 9;
}

enum TenantDB {
	SHARED = 0;
	SEPERATEDB = 1;
	SEPERATESCHEMA = 2;
}
message TenantConnectionString{
	string key=1;
	string value=2;
}

message TenantFeature{
	string key=1;
	string value=2;
}

//TenantInfo public tenant information
message TenantInfo{
	string id=1;
	string name=2;
	string display_name=3;
	string region=4;
	string logo = 5;
	TenantDB tenant_db=6;
}


message GetCurrentTenantRequest{

}

message GetCurrentTenantReply{
		TenantInfo tenant=1;
		bool is_host=2;
}