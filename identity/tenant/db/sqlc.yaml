version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/"
    schema: 
      #  - "../../identity/db/sqlc/schema.sql"
       - "schema/"
    gen:
      go:
        package: "db"
        out: "./generated"
        sql_package: "pgx/v5"
        
        # Essential settings
        emit_interface: true
        emit_json_tags: true
        emit_prepared_queries: false
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_exported_queries: true
        emit_result_struct_pointers: true
        emit_params_struct_pointers: false
        emit_methods_with_db_argument: false
        emit_pointers_for_null_types: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        omit_unused_structs: false
        
        output_models_file_name: "models.go"     # Default: models.go
        output_querier_file_name: "querier.go"   # Default: querier.go
        output_copyfrom_file_name: "copyfrom.go" # Default: copyfrom.go
        
        # Alternative: Use single file output
        # output_file_name: "sqlc_gen.go"     # Put everything in one file
        
        # Control struct/interface naming
        query_parameter_limit: 0              # Use struct for >5 params

        # Type overrides for identity tenant module
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "text[]"
            go_type:
              type: "pq.StringArray"
              import: "github.com/lib/pq"
          - db_type: "jsonb"
            go_type:
              type: "RawMessage"
              import: "encoding/json"
          - db_type: "tenant_db_type"
            go_type:
              type: "TenantDbType"
          - column: "*.workflow_id"
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"
          - column: "*.instance_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "*.form_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "*.sla_rule_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "*.sla_instance_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "*.sla_violation_id"
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"
          - column: "*.escalation_instance_id"
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"
          - column: "*.created_at"
            go_type: 
              import: "time"
              type: "Time"
          - column: "*.updated_at" 
            go_type:
              import: "time"
              type: "Time"
          - column: "*.deleted_at"
            go_type:
              import: "database/sql"
              type: "NullTime"
          - column: "*.timestamp"
            go_type:
              import: "time"
              type: "Time"
          - column: "*.uploaded_at"
            go_type:
              import: "time"
              type: "Time"
          - column: "*.start_time"
