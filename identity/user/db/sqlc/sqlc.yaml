version: "2"
sql:
  - engine: "postgresql"
    schema: "schema.sql"
    queries: "queries/"
    gen:
      go:
        package: "db"
        out: "./generated"
        sql_package: "pgx/v5"

        # Essential settings
        emit_json_tags: true
        emit_db_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        emit_methods_with_db_argument: false
        emit_enum_valid_method: true
        emit_all_enum_values: true

        output_models_file_name: "models.go"
        output_querier_file_name: "querier.go"
        output_copyfrom_file_name: "copyfrom.go"

        # Control struct/interface naming
        query_parameter_limit: 0

        # Type overrides for identity user module
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "text[]"
            go_type:
              type: "pq.StringArray"
              import: "github.com/lib/pq"
          - db_type: "jsonb"
            go_type:
              type: "RawMessage"
              import: "encoding/json"
          - db_type: "user_status"
            go_type:
              type: "UserStatus"
          - db_type: "gender_type"
            go_type:
              type: "GenderType"
          - column: "*.created_at"
            go_type:
              import: "time"
              type: "Time"
          - column: "*.updated_at"
            go_type:
              import: "time"
              type: "Time"
          - column: "*.deleted_at"
            go_type:
              import: "database/sql"
              type: "NullTime"
          - column: "*.last_login"
            go_type:
              import: "database/sql"
              type: "NullTime"
          - column: "*.assigned_at"
            go_type:
              import: "time"
              type: "Time"