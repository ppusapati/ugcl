version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/"
    schema: 
       - "../../identity/db/sqlc/schema.sql"
       - "schema/"
    gen:
      go:
        package: "db"
        out: "./generated"
        sql_package: "pgx/v5"
        
        # Essential settings
        emit_json_tags: true
        emit_db_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        emit_methods_with_db_argument: false
        
        output_models_file_name: "models.go"     # Default: models.go
        output_querier_file_name: "querier.go"   # Default: querier.go
        output_copyfrom_file_name: "copyfrom.go" # Default: copyfrom.go
        
        # Alternative: Use single file output
        # output_file_name: "sqlc_gen.go"     # Put everything in one file
        
        # Control struct/interface naming
        query_parameter_limit: 0              # Use struct for >5 params

        # Type overrides
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "jsonb"
            go_type:
              type: "json.RawMessage"
              import: "encoding/json"
          - db_type: "text[]"
            go_type:
              type: "pq.StringArray"
              import: "github.com/lib/pq"