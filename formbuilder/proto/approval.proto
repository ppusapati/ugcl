syntax = "proto3";

package formbuilder.api.v2.approval;
option go_package = "p9e.in/ugcl/formbuilder/api/v2/approval;approval";

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";

// =============================================================================
// Approval Actions
// =============================================================================

enum ActionType {
  ACTION_TYPE_UNSPECIFIED = 0;
  ACTION_TYPE_APPROVE = 1;
  ACTION_TYPE_REJECT = 2;
  ACTION_TYPE_DELEGATE = 3;
  ACTION_TYPE_REQUEST_INFO = 4;
  ACTION_TYPE_WITHDRAW = 5;
  ACTION_TYPE_REASSIGN = 6;
}

enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_LOW = 1;
  PRIORITY_MEDIUM = 2;
  PRIORITY_HIGH = 3;
  PRIORITY_CRITICAL = 4;
}

enum ApprovalStatus {
  APPROVAL_STATUS_UNSPECIFIED = 0;
  APPROVAL_STATUS_PENDING = 1;
  APPROVAL_STATUS_IN_PROGRESS = 2;
  APPROVAL_STATUS_APPROVED = 3;
  APPROVAL_STATUS_REJECTED = 4;
  APPROVAL_STATUS_CANCELLED = 5;
  APPROVAL_STATUS_ESCALATED = 6;
  APPROVAL_STATUS_EXPIRED = 7;
}

// Approval Action message
message ApprovalAction {
  string id = 1;
  string form_instance_id = 2;
  string approver_id = 3;
  ActionType action = 4;
  string comments = 5;
  google.protobuf.Timestamp acted_at = 6;
  string ip_address = 7;
  string user_agent = 8;
  string delegated_from = 9;
  repeated string attachment_urls = 10;
  google.protobuf.Any metadata = 11;
  google.protobuf.Timestamp created_at = 12;
}

// =============================================================================
// Delegation Management
// =============================================================================

message ApprovalDelegate {
  string id = 1;
  string delegator_id = 2;
  string delegate_id = 3;
  repeated string entity_types = 4;
  google.protobuf.Timestamp start_date = 5;
  google.protobuf.Timestamp end_date = 6;
  bool is_active = 7;
  string reason = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  google.protobuf.Any metadata = 11;
}

// =============================================================================
// Request/Response Messages
// =============================================================================

// Start Approval Process
message StartApprovalProcessRequest {
  string entity_type = 1;
  string entity_id = 2;
  string requested_by = 3;
  Priority priority = 4;
  google.protobuf.Any request_data = 5;
  string comments = 6;
  repeated string attachment_urls = 7;
  google.protobuf.Any metadata = 8;
}

message StartApprovalProcessResponse {
  ApprovalInstance instance = 1;
}

// Process Approval Action
message ProcessApprovalActionRequest {
  string instance_id = 1;
  string approver_id = 2;
  ActionType action = 3;
  string comments = 4;
  string ip_address = 5;
  string user_agent = 6;
  string delegated_from = 7;
  string delegate_to = 8;
  repeated string attachment_urls = 9;
  google.protobuf.Any metadata = 10;
}

message ProcessApprovalActionResponse {
  ApprovalAction action = 1;
  ApprovalInstance updated_instance = 2;
}

// Get Approval Instance
message GetApprovalInstanceRequest {
  string id = 1;
}

message GetApprovalInstanceResponse {
  ApprovalInstance instance = 1;
  repeated ApprovalAction actions = 2;
}

// List Approval Instances
message ListApprovalInstancesRequest {
  int32 page_size = 1;
  string page_token = 2;
  repeated ApprovalStatus status_filter = 3;
  string entity_type = 4;
  string requested_by = 5;
  google.protobuf.Timestamp created_after = 6;
  google.protobuf.Timestamp created_before = 7;
}

message ListApprovalInstancesResponse {
  repeated ApprovalInstance instances = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Cancel Approval Instance
message CancelApprovalInstanceRequest {
  string id = 1;
  string cancelled_by = 2;
  string reason = 3;
}

// Delegate Management
message CreateDelegateRequest {
  ApprovalDelegate delegate = 1;
}

message CreateDelegateResponse {
  ApprovalDelegate delegate = 1;
}

message UpdateDelegateRequest {
  ApprovalDelegate delegate = 1;
}

message UpdateDelegateResponse {
  ApprovalDelegate delegate = 1;
}

message DeleteDelegateRequest {
  string id = 1;
}

message ListDelegatesRequest {
  int32 page_size = 1;
  string page_token = 2;
  string delegator_id = 3;
  string delegate_id = 4;
  bool active_only = 5;
}

message ListDelegatesResponse {
  repeated ApprovalDelegate delegates = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// =============================================================================
// Metrics and Reporting
// =============================================================================

message GetApprovalMetricsRequest {
  google.protobuf.Timestamp start_date = 1;
  google.protobuf.Timestamp end_date = 2;
  string entity_type = 3;
  string workflow_id = 4;
}

message GetApprovalMetricsResponse {
  int32 total_requests = 1;
  int32 approved_count = 2;
  int32 rejected_count = 3;
  int32 pending_count = 4;
  int32 escalated_count = 5;
  double avg_processing_time_hours = 6;
  double sla_compliance_rate = 7;
  repeated MetricData daily_metrics = 8;
  repeated BottleneckInfo bottlenecks = 9;
}

message MetricData {
  google.protobuf.Timestamp date = 1;
  int32 requests = 2;
  int32 completed = 3;
  double avg_time_hours = 4;
}

message BottleneckInfo {
  string step_id = 1;
  string step_name = 2;
  double avg_time_hours = 3;
  int32 instance_count = 4;
}

// Get Pending Approvals
message GetPendingApprovalsRequest {
  string user_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  Priority priority_filter = 4;
}

message GetPendingApprovalsResponse {
  repeated PendingApproval approvals = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message PendingApproval {
  ApprovalInstance instance = 1;
  string form_title = 2;
  string form_description = 3;
  google.protobuf.Timestamp due_date = 4;
  bool is_overdue = 5;
}

// Get Approval History
message GetApprovalHistoryRequest {
  string instance_id = 1;
}

message GetApprovalHistoryResponse {
  repeated ApprovalAction actions = 1;
  repeated EscalationEvent escalations = 2;
  repeated NotificationEvent notifications = 3;
}

// =============================================================================
// Escalation Management
// =============================================================================

message ProcessEscalationsResponse {
  int32 processed_count = 1;
  repeated string escalated_instances = 2;
}

message GetEscalatedApprovalsRequest {
  int32 page_size = 1;
  string page_token = 2;
  int32 escalation_level = 3;
}

message GetEscalatedApprovalsResponse {
  repeated ApprovalInstance instances = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// =============================================================================
// Supporting Messages
// =============================================================================

message ApprovalInstance {
  string id = 1;
  string form_id = 2;
  string entity_type = 3;
  string entity_id = 4;
  string requested_by = 5;
  string assigned_to = 6;
  ApprovalStatus status = 7;
  Priority priority = 8;
  string current_step = 9;
  google.protobuf.Any request_data = 10;
  string comments = 11;
  repeated string attachment_urls = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  google.protobuf.Timestamp completed_at = 15;
  google.protobuf.Timestamp escalated_at = 16;
  int32 escalation_level = 17;
  google.protobuf.Timestamp sla_start_time = 18;
  google.protobuf.Timestamp sla_end_time = 19;
  bool sla_breached = 20;
  google.protobuf.Any metadata = 21;
}

message EscalationEvent {
  string id = 1;
  string instance_id = 2;
  int32 level = 3;
  google.protobuf.Timestamp triggered_at = 4;
  string reason = 5;
  repeated string notified_users = 6;
}

message NotificationEvent {
  string id = 1;
  string instance_id = 2;
  string type = 3;
  string recipient = 4;
  string subject = 5;
  string message = 6;
  google.protobuf.Timestamp sent_at = 7;
  bool delivered = 8;
}

// =============================================================================
// Service Definition
// =============================================================================

service ApprovalService {
  // Approval Process Management
  rpc StartApprovalProcess(StartApprovalProcessRequest) returns (StartApprovalProcessResponse);
  rpc ProcessApprovalAction(ProcessApprovalActionRequest) returns (ProcessApprovalActionResponse);
  rpc GetApprovalInstance(GetApprovalInstanceRequest) returns (GetApprovalInstanceResponse);
  rpc ListApprovalInstances(ListApprovalInstancesRequest) returns (ListApprovalInstancesResponse);
  rpc CancelApprovalInstance(CancelApprovalInstanceRequest) returns (google.protobuf.Empty);

  // Delegation Management
  rpc CreateDelegate(CreateDelegateRequest) returns (CreateDelegateResponse);
  rpc UpdateDelegate(UpdateDelegateRequest) returns (UpdateDelegateResponse);
  rpc DeleteDelegate(DeleteDelegateRequest) returns (google.protobuf.Empty);
  rpc ListDelegates(ListDelegatesRequest) returns (ListDelegatesResponse);

  // Reporting and Analytics
  rpc GetApprovalMetrics(GetApprovalMetricsRequest) returns (GetApprovalMetricsResponse);
  rpc GetPendingApprovals(GetPendingApprovalsRequest) returns (GetPendingApprovalsResponse);
  rpc GetApprovalHistory(GetApprovalHistoryRequest) returns (GetApprovalHistoryResponse);

  // Escalation Management
  rpc ProcessEscalations(google.protobuf.Empty) returns (ProcessEscalationsResponse);
  rpc GetEscalatedApprovals(GetEscalatedApprovalsRequest) returns (GetEscalatedApprovalsResponse);
}