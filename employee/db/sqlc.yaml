version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/employees.sql"
    schema: "schema/employees.sql"
    gen:
      go:
        package: "generated"
        out: "generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_exported_queries: true
        query_parameter_limit: 50
