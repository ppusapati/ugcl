# API Key configurations for third-party access
api_keys:
  "mobile-app-secret-key-123":
    app_name: "MobileApp"
    allowed_paths:
      - "/p9e.ugcl.identity.api.v2.user.User/*"
    allowed_methods:
      POST: true
    skip_ip_check: true

  "partner-portal-secret-key-456":
    app_name: "PartnerPortal"
    allowed_paths:
      - "/p9e.ugcl.projects.api.v2.dairy_site.DairySiteService/*"
    allowed_methods:
      POST: true
    skip_ip_check: false

  "internal-ops-secret-key-789":
    app_name: "InternalOps"
    allowed_paths:
      - "/*"  # All services
