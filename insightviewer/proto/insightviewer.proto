syntax = "proto3";

package insightviewer.api.v1.insightviewer;

option go_package = "p9e.in/ugcl/insightviewer/api/v1/insightviewer;insightviewer";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/empty.proto";

// =============================================================================
// Report Execution Service
// =============================================================================
service ReportExecutionService {
  // Report execution
  rpc ExecuteReport(ExecuteReportRequest) returns (ExecuteReportResponse);
  rpc GetReportRun(GetReportRunRequest) returns (GetReportRunResponse);
  rpc GetReportRunStatus(GetReportRunStatusRequest) returns (GetReportRunStatusResponse);
  rpc CancelReportRun(CancelReportRunRequest) returns (CancelReportRunResponse);
  rpc GetReportRunHistory(GetReportRunHistoryRequest) returns (GetReportRunHistoryResponse);

  // Result management
  rpc GetReportResults(GetReportResultsRequest) returns (GetReportResultsResponse);
  rpc StreamReportResults(StreamReportResultsRequest) returns (stream StreamReportResultsResponse);

  // Export functionality
  rpc ExportReport(ExportReportRequest) returns (ExportReportResponse);
  rpc GetExportStatus(GetExportStatusRequest) returns (GetExportStatusResponse);
  rpc DownloadExport(DownloadExportRequest) returns (stream DownloadExportResponse);
  rpc GetExportHistory(GetExportHistoryRequest) returns (GetExportHistoryResponse);
}

// =============================================================================
// Report Scheduling Service
// =============================================================================
service ReportSchedulingService {
  // Schedule management
  rpc CreateSchedule(CreateScheduleRequest) returns (CreateScheduleResponse);
  rpc GetSchedule(GetScheduleRequest) returns (GetScheduleResponse);
  rpc UpdateSchedule(UpdateScheduleRequest) returns (UpdateScheduleResponse);
  rpc DeleteSchedule(DeleteScheduleRequest) returns (DeleteScheduleResponse);
  rpc GetSchedulesByReport(GetSchedulesByReportRequest) returns (GetSchedulesByReportResponse);
  rpc GetUserSchedules(GetUserSchedulesRequest) returns (GetUserSchedulesResponse);

  // Schedule control
  rpc EnableSchedule(EnableScheduleRequest) returns (EnableScheduleResponse);
  rpc DisableSchedule(DisableScheduleRequest) returns (DisableScheduleResponse);
  rpc TriggerSchedule(TriggerScheduleRequest) returns (TriggerScheduleResponse);
}

// =============================================================================
// Report Subscription Service
// =============================================================================
service ReportSubscriptionService {
  // Subscription management
  rpc CreateSubscription(CreateSubscriptionRequest) returns (CreateSubscriptionResponse);
  rpc GetSubscription(GetSubscriptionRequest) returns (GetSubscriptionResponse);
  rpc UpdateSubscription(UpdateSubscriptionRequest) returns (UpdateSubscriptionResponse);
  rpc DeleteSubscription(DeleteSubscriptionRequest) returns (DeleteSubscriptionResponse);
  rpc GetUserSubscriptions(GetUserSubscriptionsRequest) returns (GetUserSubscriptionsResponse);
  rpc GetReportSubscriptions(GetReportSubscriptionsRequest) returns (GetReportSubscriptionsResponse);
}

// =============================================================================
// Report Alerts Service
// =============================================================================
service ReportAlertsService {
  // Alert management
  rpc CreateAlert(CreateAlertRequest) returns (CreateAlertResponse);
  rpc GetAlert(GetAlertRequest) returns (GetAlertResponse);
  rpc UpdateAlert(UpdateAlertRequest) returns (UpdateAlertResponse);
  rpc DeleteAlert(DeleteAlertRequest) returns (DeleteAlertResponse);
  rpc GetReportAlerts(GetReportAlertsRequest) returns (GetReportAlertsResponse);
  rpc GetUserAlerts(GetUserAlertsRequest) returns (GetUserAlertsResponse);

  // Alert control
  rpc EnableAlert(EnableAlertRequest) returns (EnableAlertResponse);
  rpc DisableAlert(DisableAlertRequest) returns (DisableAlertResponse);
  rpc TestAlert(TestAlertRequest) returns (TestAlertResponse);
}

// =============================================================================
// Cache Management Service
// =============================================================================
service CacheService {
  // Cache operations
  rpc GetCachedResult(GetCachedResultRequest) returns (GetCachedResultResponse);
  rpc InvalidateCache(InvalidateCacheRequest) returns (InvalidateCacheResponse);
  rpc GetCacheStatistics(GetCacheStatisticsRequest) returns (GetCacheStatisticsResponse);
  rpc CleanupCache(CleanupCacheRequest) returns (CleanupCacheResponse);
}

// =============================================================================
// Data Types
// =============================================================================
message ReportRun {
  string id = 1;
  string report_id = 2;
  int32 report_version = 3;
  string run_by = 4;
  google.protobuf.Timestamp run_at = 5;
  google.protobuf.Timestamp completed_at = 6;
  ReportRunStatus status = 7;
  int32 duration_ms = 8;
  int32 row_count = 9;
  string error_message = 10;
  google.protobuf.Struct parameters = 11;
  string execution_plan = 12;
  string cache_key = 13;
  string triggered_by = 14;
  google.protobuf.Struct metadata = 15;
}

enum ReportRunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_RUNNING = 1;
  RUN_STATUS_COMPLETED = 2;
  RUN_STATUS_FAILED = 3;
  RUN_STATUS_CANCELLED = 4;
  RUN_STATUS_TIMEOUT = 5;
}

message ReportResult {
  string id = 1;
  string run_id = 2;
  ResultType result_type = 3;
  google.protobuf.Struct result_json = 4;
  string result_text = 5;
  string cache_ref = 6;
  string file_path = 7;
  repeated ColumnDefinition column_info = 8;
  int32 row_count = 9;
  int32 size_bytes = 10;
  string compression = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp expires_at = 13;
  int32 access_count = 14;
  google.protobuf.Timestamp last_accessed_at = 15;
}

enum ResultType {
  RESULT_TYPE_UNSPECIFIED = 0;
  RESULT_TYPE_DATA = 1;
  RESULT_TYPE_ERROR = 2;
  RESULT_TYPE_METADATA = 3;
  RESULT_TYPE_SUMMARY = 4;
}

message ColumnDefinition {
  string name = 1;
  string data_type = 2;
  string display_name = 3;
  bool nullable = 4;
}

message ReportExport {
  string id = 1;
  string run_id = 2;
  ExportFormat format = 3;
  string file_name = 4;
  string file_path = 5;
  int64 file_size = 6;
  string mime_type = 7;
  google.protobuf.Timestamp generated_at = 8;
  string generated_by = 9;
  google.protobuf.Timestamp expires_at = 10;
  int32 download_count = 11;
  google.protobuf.Timestamp last_downloaded_at = 12;
  google.protobuf.Struct export_options = 13;
  ExportStatus status = 14;
  string error_message = 15;
}

enum ExportFormat {
  EXPORT_FORMAT_UNSPECIFIED = 0;
  EXPORT_FORMAT_CSV = 1;
  EXPORT_FORMAT_EXCEL = 2;
  EXPORT_FORMAT_XLSX = 3;
  EXPORT_FORMAT_PDF = 4;
  EXPORT_FORMAT_JSON = 5;
  EXPORT_FORMAT_XML = 6;
}

enum ExportStatus {
  EXPORT_STATUS_UNSPECIFIED = 0;
  EXPORT_STATUS_GENERATING = 1;
  EXPORT_STATUS_READY = 2;
  EXPORT_STATUS_EXPIRED = 3;
  EXPORT_STATUS_FAILED = 4;
  EXPORT_STATUS_DELETED = 5;
}

message ReportSchedule {
  string id = 1;
  string report_id = 2;
  string name = 3;
  string description = 4;
  string cron_expression = 5;
  string timezone = 6;
  bool is_active = 7;
  google.protobuf.Timestamp next_run_at = 8;
  google.protobuf.Timestamp last_run_at = 9;
  string last_run_status = 10;
  string last_run_id = 11;
  int32 run_count = 12;
  int32 failure_count = 13;
  google.protobuf.Struct parameters = 14;
  repeated ExportFormat export_formats = 15;
  bool notify_on_success = 16;
  bool notify_on_failure = 17;
  repeated string notification_recipients = 18;
  repeated string notification_channels = 19;
  int32 max_results_retained = 20;
  int32 auto_cleanup_days = 21;
  string created_by = 22;
  google.protobuf.Timestamp created_at = 23;
  string updated_by = 24;
  google.protobuf.Timestamp updated_at = 25;
}

message ReportSubscription {
  string id = 1;
  string report_id = 2;
  string user_id = 3;
  NotificationFrequency notification_frequency = 4;
  repeated string notification_channels = 5;
  bool notify_on_changes = 6;
  bool notify_on_errors = 7;
  google.protobuf.Struct threshold_conditions = 8;
  bool is_active = 9;
  google.protobuf.Timestamp last_notification_at = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

enum NotificationFrequency {
  NOTIFICATION_FREQUENCY_UNSPECIFIED = 0;
  NOTIFICATION_FREQUENCY_IMMEDIATE = 1;
  NOTIFICATION_FREQUENCY_DAILY = 2;
  NOTIFICATION_FREQUENCY_WEEKLY = 3;
  NOTIFICATION_FREQUENCY_MONTHLY = 4;
  NOTIFICATION_FREQUENCY_NEVER = 5;
}

message ReportAlert {
  string id = 1;
  string report_id = 2;
  string name = 3;
  string description = 4;
  string field_id = 5;
  string operator = 6;
  string threshold_value = 7;
  AlertConditionType condition_type = 8;
  bool is_active = 9;
  AlertSeverity severity = 10;
  repeated string notification_channels = 11;
  repeated string notification_recipients = 12;
  string notification_message = 13;
  google.protobuf.Timestamp last_triggered_at = 14;
  int32 trigger_count = 15;
  string created_by = 16;
  google.protobuf.Timestamp created_at = 17;
  string updated_by = 18;
  google.protobuf.Timestamp updated_at = 19;
}

enum AlertConditionType {
  ALERT_CONDITION_TYPE_UNSPECIFIED = 0;
  ALERT_CONDITION_TYPE_VALUE = 1;
  ALERT_CONDITION_TYPE_CHANGE = 2;
  ALERT_CONDITION_TYPE_TREND = 3;
  ALERT_CONDITION_TYPE_ANOMALY = 4;
}

enum AlertSeverity {
  ALERT_SEVERITY_UNSPECIFIED = 0;
  ALERT_SEVERITY_LOW = 1;
  ALERT_SEVERITY_MEDIUM = 2;
  ALERT_SEVERITY_HIGH = 3;
  ALERT_SEVERITY_CRITICAL = 4;
}

// =============================================================================
// Request/Response Messages
// =============================================================================

// Report Execution
message ExecuteReportRequest {
  string report_id = 1;
  string user_id = 2;
  google.protobuf.Struct parameters = 3;
  string triggered_by = 4; // manual, scheduled, api, webhook
  bool use_cache = 5;
  int32 cache_ttl_seconds = 6;
}

message ExecuteReportResponse {
  ReportRun run = 1;
}

message GetReportRunRequest {
  string run_id = 1;
}

message GetReportRunResponse {
  ReportRun run = 1;
}

message GetReportRunStatusRequest {
  string run_id = 1;
}

message GetReportRunStatusResponse {
  ReportRunStatus status = 1;
  string error_message = 2;
  int32 progress_percent = 3;
}

message CancelReportRunRequest {
  string run_id = 1;
}

message CancelReportRunResponse {
  bool success = 1;
}

message GetReportRunHistoryRequest {
  string report_id = 1;
  string user_id = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message GetReportRunHistoryResponse {
  repeated ReportRun runs = 1;
  int32 total_count = 2;
}

// Result Management
message GetReportResultsRequest {
  string run_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  repeated string columns = 4; // Optional column filtering
}

message GetReportResultsResponse {
  ReportResult result = 1;
  repeated google.protobuf.Struct rows = 2;
  int32 total_rows = 3;
}

message StreamReportResultsRequest {
  string run_id = 1;
  int32 batch_size = 2;
}

message StreamReportResultsResponse {
  repeated google.protobuf.Struct rows = 1;
  bool is_last_batch = 2;
  int32 batch_number = 3;
}

// Export Management
message ExportReportRequest {
  string run_id = 1;
  ExportFormat format = 2;
  string user_id = 3;
  google.protobuf.Struct options = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message ExportReportResponse {
  ReportExport export = 1;
}

message GetExportStatusRequest {
  string export_id = 1;
}

message GetExportStatusResponse {
  ReportExport export = 1;
}

message DownloadExportRequest {
  string export_id = 1;
}

message DownloadExportResponse {
  bytes chunk = 1;
  string filename = 2;
  string content_type = 3;
  int64 total_size = 4;
}

message GetExportHistoryRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetExportHistoryResponse {
  repeated ReportExport exports = 1;
  int32 total_count = 2;
}

// Schedule Management
message CreateScheduleRequest {
  string report_id = 1;
  string name = 2;
  string description = 3;
  string cron_expression = 4;
  string timezone = 5;
  google.protobuf.Struct parameters = 6;
  repeated ExportFormat export_formats = 7;
  bool notify_on_success = 8;
  bool notify_on_failure = 9;
  repeated string notification_recipients = 10;
  repeated string notification_channels = 11;
  int32 max_results_retained = 12;
  int32 auto_cleanup_days = 13;
  string created_by = 14;
}

message CreateScheduleResponse {
  ReportSchedule schedule = 1;
}

message GetScheduleRequest {
  string schedule_id = 1;
}

message GetScheduleResponse {
  ReportSchedule schedule = 1;
}

message UpdateScheduleRequest {
  string schedule_id = 1;
  string name = 2;
  string description = 3;
  string cron_expression = 4;
  string timezone = 5;
  google.protobuf.Struct parameters = 6;
  repeated ExportFormat export_formats = 7;
  bool notify_on_success = 8;
  bool notify_on_failure = 9;
  repeated string notification_recipients = 10;
  repeated string notification_channels = 11;
  int32 max_results_retained = 12;
  int32 auto_cleanup_days = 13;
  string updated_by = 14;
}

message UpdateScheduleResponse {
  ReportSchedule schedule = 1;
}

message DeleteScheduleRequest {
  string schedule_id = 1;
}

message DeleteScheduleResponse {
  bool success = 1;
}

message GetSchedulesByReportRequest {
  string report_id = 1;
}

message GetSchedulesByReportResponse {
  repeated ReportSchedule schedules = 1;
}

message GetUserSchedulesRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetUserSchedulesResponse {
  repeated ReportSchedule schedules = 1;
  int32 total_count = 2;
}

message EnableScheduleRequest {
  string schedule_id = 1;
  string updated_by = 2;
}

message EnableScheduleResponse {
  bool success = 1;
}

message DisableScheduleRequest {
  string schedule_id = 1;
  string updated_by = 2;
}

message DisableScheduleResponse {
  bool success = 1;
}

message TriggerScheduleRequest {
  string schedule_id = 1;
  string triggered_by = 2;
}

message TriggerScheduleResponse {
  ReportRun run = 1;
}

// Subscription Management
message CreateSubscriptionRequest {
  string report_id = 1;
  string user_id = 2;
  NotificationFrequency notification_frequency = 3;
  repeated string notification_channels = 4;
  bool notify_on_changes = 5;
  bool notify_on_errors = 6;
  google.protobuf.Struct threshold_conditions = 7;
}

message CreateSubscriptionResponse {
  ReportSubscription subscription = 1;
}

message GetSubscriptionRequest {
  string subscription_id = 1;
}

message GetSubscriptionResponse {
  ReportSubscription subscription = 1;
}

message UpdateSubscriptionRequest {
  string subscription_id = 1;
  NotificationFrequency notification_frequency = 2;
  repeated string notification_channels = 3;
  bool notify_on_changes = 4;
  bool notify_on_errors = 5;
  google.protobuf.Struct threshold_conditions = 6;
}

message UpdateSubscriptionResponse {
  ReportSubscription subscription = 1;
}

message DeleteSubscriptionRequest {
  string subscription_id = 1;
}

message DeleteSubscriptionResponse {
  bool success = 1;
}

message GetUserSubscriptionsRequest {
  string user_id = 1;
}

message GetUserSubscriptionsResponse {
  repeated ReportSubscription subscriptions = 1;
}

message GetReportSubscriptionsRequest {
  string report_id = 1;
}

message GetReportSubscriptionsResponse {
  repeated ReportSubscription subscriptions = 1;
}

// Alert Management
message CreateAlertRequest {
  string report_id = 1;
  string name = 2;
  string description = 3;
  string field_id = 4;
  string operator = 5;
  string threshold_value = 6;
  AlertConditionType condition_type = 7;
  AlertSeverity severity = 8;
  repeated string notification_channels = 9;
  repeated string notification_recipients = 10;
  string notification_message = 11;
  string created_by = 12;
}

message CreateAlertResponse {
  ReportAlert alert = 1;
}

message GetAlertRequest {
  string alert_id = 1;
}

message GetAlertResponse {
  ReportAlert alert = 1;
}

message UpdateAlertRequest {
  string alert_id = 1;
  string name = 2;
  string description = 3;
  string field_id = 4;
  string operator = 5;
  string threshold_value = 6;
  AlertConditionType condition_type = 7;
  AlertSeverity severity = 8;
  repeated string notification_channels = 9;
  repeated string notification_recipients = 10;
  string notification_message = 11;
  string updated_by = 12;
}

message UpdateAlertResponse {
  ReportAlert alert = 1;
}

message DeleteAlertRequest {
  string alert_id = 1;
}

message DeleteAlertResponse {
  bool success = 1;
}

message GetReportAlertsRequest {
  string report_id = 1;
}

message GetReportAlertsResponse {
  repeated ReportAlert alerts = 1;
}

message GetUserAlertsRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetUserAlertsResponse {
  repeated ReportAlert alerts = 1;
  int32 total_count = 2;
}

message EnableAlertRequest {
  string alert_id = 1;
  string updated_by = 2;
}

message EnableAlertResponse {
  bool success = 1;
}

message DisableAlertRequest {
  string alert_id = 1;
  string updated_by = 2;
}

message DisableAlertResponse {
  bool success = 1;
}

message TestAlertRequest {
  string alert_id = 1;
  google.protobuf.Struct test_data = 2;
}

message TestAlertResponse {
  bool would_trigger = 1;
  string message = 2;
}

// Cache Management
message GetCachedResultRequest {
  string cache_key = 1;
}

message GetCachedResultResponse {
  google.protobuf.Struct data = 1;
  bool found = 2;
}

message InvalidateCacheRequest {
  oneof target {
    string cache_key = 1;
    string report_id = 2;
  }
}

message InvalidateCacheResponse {
  bool success = 1;
  int32 keys_invalidated = 2;
}

message GetCacheStatisticsRequest {
  google.protobuf.Timestamp since = 1;
}

message GetCacheStatisticsResponse {
  int32 total_entries = 1;
  int64 total_size_bytes = 2;
  double hit_rate_percent = 3;
  int64 total_hits = 4;
  int64 total_misses = 5;
}

message CleanupCacheRequest {
  google.protobuf.Empty empty = 1;
}

message CleanupCacheResponse {
  int32 entries_cleaned = 1;
  int64 bytes_freed = 2;
}