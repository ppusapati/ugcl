  int32 page_size = 1;
  string page_token = 2;
  string plan_id = 3;
  ExecutionType execution_type = 4;
  ExecutionStatus status = 5;
}

message ListRecoveryExecutionsResponse {
  repeated RecoveryExecution executions = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message AbortRecoveryRequest {
  string id = 1;
  string reason = 2;
  string aborted_by = 3;
}

// System Health Monitoring
message GetSystemHealthRequest {
  string system_name = 1;
}

message GetSystemHealthResponse {
  SystemHealth health = 1;
}

message ListSystemHealthRequest {
  int32 page_size = 1;
  string page_token = 2;
  HealthStatus status_filter = 3;
  string system_type = 4;
}

message ListSystemHealthResponse {
  repeated SystemHealth health_records = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message UpdateSystemHealthRequest {
  SystemHealth health = 1;
}

message UpdateSystemHealthResponse {
  SystemHealth health = 1;
}

// Storage Management
message CreateStorageLocationRequest {
  BackupStorageLocation location = 1;
}

message CreateStorageLocationResponse {
  BackupStorageLocation location = 1;
}

message GetStorageLocationRequest {
  string id = 1;
}

message GetStorageLocationResponse {
  BackupStorageLocation location = 1;
}

message ListStorageLocationsRequest {
  int32 page_size = 1;
  string page_token = 2;
  StorageType storage_type = 3;
  bool active_only = 4;
}

message ListStorageLocationsResponse {
  repeated BackupStorageLocation locations = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message TestStorageConnectionRequest {
  string location_id = 1;
}

message TestStorageConnectionResponse {
  bool is_healthy = 1;
  double latency_ms = 2;
  string error_message = 3;
  google.protobuf.Struct connection_details = 4;
}

// Analytics and Reporting
message GetBackupMetricsRequest {
  google.protobuf.Timestamp start_date = 1;
  google.protobuf.Timestamp end_date = 2;
  string target_type = 3;
}

message GetBackupMetricsResponse {
  int32 total_policies = 1;
  int32 active_policies = 2;
  int64 successful_backups = 3;
  int64 failed_backups = 4;
  int64 total_backup_size = 5;
  google.protobuf.Duration avg_backup_duration = 6;
  repeated DailyBackupMetric daily_metrics = 7;
}

message DailyBackupMetric {
  google.protobuf.Timestamp date = 1;
  int32 successful_jobs = 2;
  int32 failed_jobs = 3;
  int64 total_size = 4;
  google.protobuf.Duration avg_duration = 5;
}

message GetRecoveryMetricsRequest {
  google.protobuf.Timestamp start_date = 1;
  google.protobuf.Timestamp end_date = 2;
}

message GetRecoveryMetricsResponse {
  int64 total_executions = 1;
  int64 successful_executions = 2;
  int64 failed_executions = 3;
  google.protobuf.Duration avg_rto = 4;
  double success_rate = 5;
  repeated RecoveryMetric recovery_metrics = 6;
}

message RecoveryMetric {
  google.protobuf.Timestamp date = 1;
  int32 executions = 2;
  google.protobuf.Duration avg_rto = 3;
  double success_rate = 4;
}

message GetBackupDashboardRequest {
  string target_type = 1;
}

message GetBackupDashboardResponse {
  repeated PolicySummary policy_summaries = 1;
  int32 active_jobs = 2;
  int32 failed_jobs = 3;
  int32 overdue_backups = 4;
  SystemHealthSummary health_summary = 5;
  StorageSummary storage_summary = 6;
}

message PolicySummary {
  string id = 1;
  string name = 2;
  string target_name = 3;
  BackupType backup_type = 4;
  bool is_active = 5;
  google.protobuf.Timestamp last_backup = 6;
  google.protobuf.Timestamp next_backup = 7;
  bool is_overdue = 8;
  int32 total_jobs = 9;
  int32 successful_jobs = 10;
  int32 failed_jobs = 11;
  int64 total_backup_size = 12;
}

message SystemHealthSummary {
  int32 healthy_systems = 1;
  int32 warning_systems = 2;
  int32 critical_systems = 3;
  int32 down_systems = 4;
  double overall_availability = 5;
}

message StorageSummary {
  int64 total_capacity = 1;
  int64 used_capacity = 2;
  int64 available_capacity = 3;
  double usage_percentage = 4;
  int32 healthy_locations = 5;
  int32 unhealthy_locations = 6;
}

message GetOverdueBackupsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message GetOverdueBackupsResponse {
  repeated OverdueBackup overdue_backups = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message OverdueBackup {
  string policy_id = 1;
  string policy_name = 2;
  string target_name = 3;
  google.protobuf.Timestamp last_backup = 4;
  google.protobuf.Timestamp next_backup = 5;
  double hours_overdue = 6;
}