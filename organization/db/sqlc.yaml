version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/"
    schema:
      - "schema/"
    gen:
      go:
        package: "db"
        out: "./generated"
        sql_package: "pgx/v5"

        # Essential settings
        emit_interface: true
        emit_json_tags: true
        emit_prepared_queries: false
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_exported_queries: true
        emit_result_struct_pointers: true
        emit_params_struct_pointers: false
        emit_methods_with_db_argument: false
        emit_pointers_for_null_types: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        omit_unused_structs: false

        output_models_file_name: "models.go"
        output_querier_file_name: "querier.go"
        output_copyfrom_file_name: "copyfrom.go"

        query_parameter_limit: 0

        # Type overrides
        overrides:
          - column: "*.id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "*.tenant_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "*.division_id"
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"
          - column: "*.parent_department_id"
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"
          - column: "*.created_at"
            go_type:
              import: "time"
              type: "Time"
          - column: "*.updated_at"
            go_type:
              import: "time"
              type: "Time"
          - column: "*.metadata"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - column: "branches.latitude"
            go_type:
              import: "database/sql"
              type: "NullFloat64"
          - column: "branches.longitude"
            go_type:
              import: "database/sql"
              type: "NullFloat64"
