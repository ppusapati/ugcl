syntax = "proto3";

package scheduler.v1;

option go_package = "p9e.in/ugcl/scheduler/api/proto;schedulerv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/empty.proto";

// =============================================================================
// Scheduler Service
// =============================================================================
service SchedulerService {
  // Job Management
  rpc CreateJob(CreateJobRequest) returns (CreateJobResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc UpdateJob(UpdateJobRequest) returns (UpdateJobResponse);
  rpc DeleteJob(DeleteJobRequest) returns (DeleteJobResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);

  // Job Control
  rpc EnableJob(EnableJobRequest) returns (EnableJobResponse);
  rpc DisableJob(DisableJobRequest) returns (DisableJobResponse);
  rpc TriggerJob(TriggerJobRequest) returns (TriggerJobResponse);

  // Execution Monitoring
  rpc GetJobExecutions(GetJobExecutionsRequest) returns (GetJobExecutionsResponse);
  rpc GetJobExecution(GetJobExecutionRequest) returns (GetJobExecutionResponse);
  rpc CancelJobExecution(CancelJobExecutionRequest) returns (CancelJobExecutionResponse);

  // Health and Status
  rpc GetSchedulerHealth(google.protobuf.Empty) returns (GetSchedulerHealthResponse);
  rpc GetJobStatistics(GetJobStatisticsRequest) returns (GetJobStatisticsResponse);
}

// =============================================================================
// Data Types
// =============================================================================
message Job {
  string id = 1;
  string name = 2;
  string description = 3;
  string cron_expression = 4;
  bool is_active = 5;

  // Target configuration
  string target_service = 6;
  string target_method = 7;
  google.protobuf.Struct target_payload = 8;

  // Execution settings
  int32 timeout_seconds = 9;
  int32 max_retries = 10;
  int32 retry_interval = 11;

  // Scheduling info
  google.protobuf.Timestamp next_run_at = 12;
  google.protobuf.Timestamp last_run_at = 13;
  string last_run_status = 14;
  int32 run_count = 15;
  int32 failure_count = 16;

  // Notification settings
  bool notify_on_success = 17;
  bool notify_on_failure = 18;
  repeated string notification_channels = 19;
  repeated string notification_recipients = 20;

  // Metadata
  string created_by = 21;
  google.protobuf.Timestamp created_at = 22;
  string updated_by = 23;
  google.protobuf.Timestamp updated_at = 24;
}

message JobExecution {
  string id = 1;
  string job_id = 2;
  JobExecutionStatus status = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp completed_at = 5;
  int32 duration_ms = 6;

  google.protobuf.Struct request_payload = 7;
  google.protobuf.Struct response_data = 8;
  string error_message = 9;
  int32 retry_attempt = 10;

  string triggered_by = 11;
  string host_name = 12;
  google.protobuf.Timestamp created_at = 13;
}

enum JobExecutionStatus {
  JOB_EXECUTION_STATUS_UNSPECIFIED = 0;
  JOB_EXECUTION_STATUS_RUNNING = 1;
  JOB_EXECUTION_STATUS_SUCCESS = 2;
  JOB_EXECUTION_STATUS_FAILED = 3;
  JOB_EXECUTION_STATUS_TIMEOUT = 4;
  JOB_EXECUTION_STATUS_CANCELLED = 5;
}

// =============================================================================
// Request/Response Messages
// =============================================================================

// Job Management
message CreateJobRequest {
  string name = 1;
  string description = 2;
  string cron_expression = 3;
  string target_service = 4;
  string target_method = 5;
  google.protobuf.Struct target_payload = 6;
  int32 timeout_seconds = 7;
  int32 max_retries = 8;
  int32 retry_interval = 9;
  bool notify_on_success = 10;
  bool notify_on_failure = 11;
  repeated string notification_channels = 12;
  repeated string notification_recipients = 13;
  string created_by = 14;
}

message CreateJobResponse {
  Job job = 1;
}

message GetJobRequest {
  string job_id = 1;
}

message GetJobResponse {
  Job job = 1;
}

message UpdateJobRequest {
  string job_id = 1;
  string name = 2;
  string description = 3;
  string cron_expression = 4;
  string target_service = 5;
  string target_method = 6;
  google.protobuf.Struct target_payload = 7;
  int32 timeout_seconds = 8;
  int32 max_retries = 9;
  int32 retry_interval = 10;
  bool notify_on_success = 11;
  bool notify_on_failure = 12;
  repeated string notification_channels = 13;
  repeated string notification_recipients = 14;
  string updated_by = 15;
}

message UpdateJobResponse {
  Job job = 1;
}

message DeleteJobRequest {
  string job_id = 1;
}

message DeleteJobResponse {
  bool success = 1;
}

message ListJobsRequest {
  string filter_service = 1; // Optional: filter by target service
  bool filter_active_only = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ListJobsResponse {
  repeated Job jobs = 1;
  int32 total_count = 2;
}

// Job Control
message EnableJobRequest {
  string job_id = 1;
  string updated_by = 2;
}

message EnableJobResponse {
  bool success = 1;
  google.protobuf.Timestamp next_run_at = 2;
}

message DisableJobRequest {
  string job_id = 1;
  string updated_by = 2;
}

message DisableJobResponse {
  bool success = 1;
}

message TriggerJobRequest {
  string job_id = 1;
  string triggered_by = 2;
  google.protobuf.Struct override_payload = 3; // Optional payload override
}

message TriggerJobResponse {
  JobExecution execution = 1;
}

// Execution Monitoring
message GetJobExecutionsRequest {
  string job_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetJobExecutionsResponse {
  repeated JobExecution executions = 1;
  int32 total_count = 2;
}

message GetJobExecutionRequest {
  string execution_id = 1;
}

message GetJobExecutionResponse {
  JobExecution execution = 1;
}

message CancelJobExecutionRequest {
  string execution_id = 1;
}

message CancelJobExecutionResponse {
  bool success = 1;
}

// Health and Statistics
message GetSchedulerHealthResponse {
  string status = 1; // "healthy", "degraded", "unhealthy"
  int32 active_jobs = 2;
  int32 running_executions = 3;
  google.protobuf.Timestamp last_heartbeat = 4;
  string version = 5;
}

message GetJobStatisticsRequest {
  string job_id = 1; // Optional: stats for specific job
  google.protobuf.Timestamp since = 2; // Optional: stats since timestamp
}

message GetJobStatisticsResponse {
  int32 total_executions = 1;
  int32 successful_executions = 2;
  int32 failed_executions = 3;
  double success_rate = 4;
  double average_duration_ms = 5;
  google.protobuf.Timestamp last_execution = 6;
}